! SW1: PAgP EtherChannel example. REVIEW ALL INTERFACE NAMES BEFORE APPLYING.
! Gi0/1 and Gi0/2 below are PLACEHOLDERS, NOT verified physical links.
! Original report used SW1 Gi0/1 toward R1. DO NOT overwrite router uplinks.
! Replace both interface IDs with the actual TWO links between SW1 and SW2.
! Stage changes from console/OOB management; altering live trunk can disconnect management.
!
configure terminal
interface range GigabitEthernet0/1 - 2
 description TO-SW2-PAGP-MEMBERS-VERIFY-PORTS
 switchport
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 99
 switchport trunk allowed vlan 10,20,30,40,50,60,99
 channel-protocol pagp
 channel-group 1 mode desirable
 no shutdown
exit
interface Port-channel1
 description SW1-TO-SW2-PAGP-8021Q
 switchport
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 99
 switchport trunk allowed vlan 10,20,30,40,50,60,99
 no shutdown
exit
end
! On platforms with fixed dot1q encapsulation, omit the unsupported
! 'switchport trunk encapsulation dot1q' command.
! Verify BEFORE 'write memory': show etherchannel summary; show interfaces trunk

! RECONSTRUCTED / PROPOSED LAB CONFIGURATION - NOT AN EXPORTED RUNNING-CONFIG
! Replace all <...> placeholders after verifying show interfaces status and cabling.
! DO NOT paste into a live device without console access, backups and a rollback plan.
! No passwords, SNMP communities or public credentials are included.
hostname SW2
no ip domain-lookup
! Management SVI; assumes VLAN 99 is carried to a reachable gateway.
vlan 10
 name USERS
vlan 20
 name VOICE
vlan 30
 name SERVERS
vlan 40
 name CAMERAS_NVR
vlan 50
 name GUESTS
vlan 60
 name IOT_SECURE
vlan 99
 name MANAGEMENT
interface Vlan99
 description MANAGEMENT_SVI
 ip address 10.99.99.12 255.255.255.0
 no shutdown
!
ip default-gateway 10.99.99.254
spanning-tree mode rapid-pvst
! CAUTION: confirm IOS/switch model supports PAgP and chosen interface names.
! Verify the TWO unused physical links between SW1 and SW2.
interface range <SW_SW2_PORT_A> , <SW_SW2_PORT_B>
 description PAgP_MEMBER_TO_SW1
 switchport
 switchport mode trunk
 switchport trunk native vlan 99
 switchport trunk allowed vlan 10,20,30,40,50,60,99
 channel-group 1 mode auto
 no shutdown
!
interface Port-channel1
 description PAgP_8021Q_TO_SW1
 switchport
 switchport mode trunk
 switchport trunk native vlan 99
 switchport trunk allowed vlan 10,20,30,40,50,60,99
 no shutdown
!
! Only enable BPDU Guard/PortFast on verified END-DEVICE access ports.
! interface range <END_DEVICE_ACCESS_PORTS>
!  switchport mode access
!  switchport access vlan <CLIENT_VLAN>
!  spanning-tree portfast
!  spanning-tree bpduguard enable

! TEMPLATE ONLY. Apply on actual L3 gateway interface(s) for client VLANs.
! Cisco IOS examples assume a router-on-a-stick design; DO NOT apply
! these subinterfaces if FortiGate or a different switch owns the gateways.
! Replace <TRUNK_PHYSICAL_INTERFACE> with a verified router trunk (e.g. Gi0/0).
! Replace 10.10.X.1 with ACTUAL VLAN gateway IPs.
! The relay target 10.99.99.2 is the optional IOS DHCP server on R1.
!
! Example for VLAN 10 ONLY (copy the pattern to VLANs 20,30,40,50,60):
! configure terminal
! interface <TRUNK_PHYSICAL_INTERFACE>.10
!  encapsulation dot1Q 10
!  ip address 10.10.10.1 255.255.255.0
!  ip helper-address 10.99.99.2
!  no shutdown
! exit
! end
!
! If the L3 gateway is a Cisco multilayer switch with existing SVIs:
! configure terminal
! interface Vlan10
!  ip helper-address 10.99.99.2
! exit
! interface Vlan20
!  ip helper-address 10.99.99.2
! exit
! interface Vlan30
!  ip helper-address 10.99.99.2
! exit
! interface Vlan40
!  ip helper-address 10.99.99.2
! exit
! interface Vlan50
!  ip helper-address 10.99.99.2
! exit
! interface Vlan60
!  ip helper-address 10.99.99.2
! exit
! end
!
! If FortiGate is the client VLAN gateway and DHCP is served remotely,
! configure FortiGate's DHCP relay service on each relevant VLAN interface
! using 'set dhcp-relay-service enable' and 'set dhcp-relay-ip 10.99.99.2',
! but ONLY after disabling conflicting local DHCP service for that interface.
! See Fortinet official DHCP servers and relays documentation for your FortiOS.

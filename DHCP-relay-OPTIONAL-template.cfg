! No passwords, SNMP communities or public credentials are included.
! OPTIONAL DHCP RELAY DESIGN - NOT A VERIFIED RUNNING CONFIG
! Choose ONE DHCP server and ensure it has scopes and return routes.
! Scenario: FortiGate DHCP server reachable at 10.99.99.1.
! Apply on the ACTUAL L3 gateway interface for each client VLAN,
! not on a Layer 2 switchport or a management-only VRRP interface.
! Example ONLY if a Cisco router terminates the VLAN with the shown IP:
! interface <ROUTER_TRUNK_INTERFACE>.10
!  encapsulation dot1Q 10
!  ip address <CONFIRMED_VLAN10_GATEWAY_IP> 255.255.255.0
!  ip helper-address 10.99.99.1
! Repeat for VLANs 20, 30, 40, 50, 60 after confirming gateways.
! DHCP server pools, firewall policies, and routes back to each VLAN
! must be configured on FortiGate and tested.
! If FortiGate itself is the client VLAN gateway/DHCP server,
! Cisco ip helper-address is unnecessary.
! Do not enable a second DHCP server for the same VLAN accidentally.

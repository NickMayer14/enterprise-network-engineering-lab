
hostname SW1
no ip domain-lookup

vlan 10
 name USERS
vlan 20
 name VOICE
vlan 30
 name SERVERS
vlan 40
 name CAMERAS_NVR
vlan 50
 name GUESTS
vlan 60
 name IOT_SECURE
vlan 99
 name MANAGEMENT
interface Vlan99
 description MANAGEMENT_SVI
 ip address 10.99.99.11 255.255.255.0
 no shutdown
!
ip default-gateway 10.99.99.254
spanning-tree mode rapid-pvst

interface range <SW_SW1_PORT_A> , <SW_SW1_PORT_B>
 description PAgP_MEMBER_TO_SW2
 switchport
 switchport mode trunk
 switchport trunk native vlan 99
 switchport trunk allowed vlan 10,20,30,40,50,60,99
 channel-group 1 mode desirable
 no shutdown
!
interface Port-channel1
 description PAgP_8021Q_TO_SW2
 switchport
 switchport mode trunk
 switchport trunk native vlan 99
 switchport trunk allowed vlan 10,20,30,40,50,60,99
 no shutdown
!
! Only enable BPDU Guard/PortFast on verified END-DEVICE access ports.
! interface range <END_DEVICE_ACCESS_PORTS>
!  switchport mode access
!  switchport access vlan <CLIENT_VLAN>
!  spanning-tree portfast
!  spanning-tree bpduguard enable
!
! Documented router-facing trunks on SW1: Gi0/1 -> R1, Gi0/3 -> R2.
! Verify real interface naming/model before applying these blocks.
interface GigabitEthernet0/1
 description TRUNK_TO_R1
 switchport mode trunk
 switchport trunk native vlan 99
 switchport trunk allowed vlan 10,20,30,40,50,60,99
 no shutdown
!
interface GigabitEthernet0/3
 description TRUNK_TO_R2
 switchport mode trunk
 switchport trunk native vlan 99
 switchport trunk allowed vlan 10,20,30,40,50,60,99
 no shutdown

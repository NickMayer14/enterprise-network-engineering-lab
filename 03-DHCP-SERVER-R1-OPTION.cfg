! OPTIONAL ALTERNATIVE DESIGN: Cisco IOS R1 as DHCP server, IP 10.99.99.2.
! NOT the same as existing FortiGate DHCP configuration.
! Apply ONLY after confirming R1 can route to each client VLAN, client gateways
! relay to 10.99.99.2, and overlapping FortiGate DHCP scopes are disabled.
! The default-router IPs below (.1) are EXAMPLES, not verified live gateways.
! Replace them with the actual gateway IP for each VLAN before deployment.
! DHCP exclusions reserve infrastructure addresses and exclude static range .1-.49.
configure terminal
service dhcp
ip dhcp excluded-address 10.10.10.1 10.10.10.49
ip dhcp excluded-address 10.10.20.1 10.10.20.49
ip dhcp excluded-address 10.10.30.1 10.10.30.49
ip dhcp excluded-address 10.10.40.1 10.10.40.49
ip dhcp excluded-address 10.10.50.1 10.10.50.49
ip dhcp excluded-address 10.10.60.1 10.10.60.49
!
ip dhcp pool VLAN10_USERS
 network 10.10.10.0 255.255.255.0
 default-router 10.10.10.1
 dns-server 1.1.1.1 8.8.8.8
 lease 7
ip dhcp pool VLAN20_VOICE
 network 10.10.20.0 255.255.255.0
 default-router 10.10.20.1
 dns-server 1.1.1.1 8.8.8.8
 lease 7
ip dhcp pool VLAN30_SERVERS
 network 10.10.30.0 255.255.255.0
 default-router 10.10.30.1
 dns-server 1.1.1.1 8.8.8.8
 lease 7
ip dhcp pool VLAN40_NVR
 network 10.10.40.0 255.255.255.0
 default-router 10.10.40.1
 dns-server 1.1.1.1 8.8.8.8
 lease 7
ip dhcp pool VLAN50_GUESTS
 network 10.10.50.0 255.255.255.0
 default-router 10.10.50.1
 dns-server 1.1.1.1 8.8.8.8
 lease 1
ip dhcp pool VLAN60_IOT
 network 10.10.60.0 255.255.255.0
 default-router 10.10.60.1
 dns-server 1.1.1.1 8.8.8.8
 lease 7
end
! Voice, server, NVR and IoT VLANs may use static IP or special DHCP options.
! Only enable pools actually needed. No DHCP pool is defined for VLAN99.

! RECONSTRUCTED / PROPOSED LAB CONFIGURATION - NOT AN EXPORTED RUNNING-CONFIG
! Replace all <...> placeholders after verifying show interfaces status and cabling.
! DO NOT paste into a live device without console access, backups and a rollback plan.
! No passwords, SNMP communities or public credentials are included.
hostname R1
no ip domain-lookup
! Cisco 2900-series; IOS and module compatibility MUST be verified.
! VLAN 99 is native/untagged on SW1 trunk; physical interface name is unknown.
interface <R1_TO_SW1_ETHERNET_INTERFACE>
 description TRUNK_TO_SW1_NATIVE_VLAN_99
 no ip address
 no shutdown
!
interface <R1_TO_SW1_ETHERNET_INTERFACE>.99
 description VLAN99_MANAGEMENT_VRRP
 encapsulation dot1Q 99 native
 ip address 10.99.99.2 255.255.255.0
 vrrp 99 ip 10.99.99.254
 vrrp 99 priority 150
 vrrp 99 preempt
!
! VRRP on VLAN 99 ONLY. No VRRP VIPs on VLANs 10-60 are evidenced.
! The routing/gateway placement for client VLANs remains unverified.
! Do NOT add ip helper-address until client VLAN gateway placement is known.
! The firewall's 10.99.99.1 address is reported, but L3 adjacency
! and firewall-facing interface topology must be verified before default route.
! ip route 0.0.0.0 0.0.0.0 10.99.99.1

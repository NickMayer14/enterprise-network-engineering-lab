hostname R1
no ip domain-lookup
! Cisco 2900-series; 
interface <R1_TO_SW1_ETHERNET_INTERFACE>
 description TRUNK_TO_SW1_NATIVE_VLAN_99
 no ip address
 no shutdown
!
interface <R1_TO_SW1_ETHERNET_INTERFACE>.99
 description VLAN99_MANAGEMENT_VRRP
 encapsulation dot1Q 99 native
 ip address 10.99.99.2 255.255.255.0
 vrrp 99 ip 10.99.99.254
 vrrp 99 priority 150
 vrrp 99 preempt



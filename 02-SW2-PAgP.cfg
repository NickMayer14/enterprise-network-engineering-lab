! SW2: PAgP EtherChannel peer. VERIFY the two actual SW2-to-SW1 interfaces.
! Interface IDs are illustrative only. They must match the physical cables.
configure terminal
interface range GigabitEthernet0/1 - 2
 description TO-SW1-PAGP-MEMBERS-VERIFY-PORTS
 switchport
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 99
 switchport trunk allowed vlan 10,20,30,40,50,60,99
 channel-protocol pagp
 channel-group 1 mode auto
 no shutdown
exit
interface Port-channel1
 description SW2-TO-SW1-PAGP-8021Q
 switchport
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 99
 switchport trunk allowed vlan 10,20,30,40,50,60,99
 no shutdown
exit
end
! On fixed dot1q platforms, omit unsupported encapsulation command.
! PAgP desirable (SW1) + auto (SW2) is valid; auto + auto is not.
